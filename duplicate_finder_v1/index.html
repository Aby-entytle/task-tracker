<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duplicate Finder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0e0f11;
    --surface: #16181c;
    --surface2: #1e2128;
    --border: #2a2d35;
    --accent: #00e5a0;
    --accent2: #0077ff;
    --danger: #ff4d6a;
    --text: #e8eaf0;
    --text-muted: #6b7280;
    --text-dim: #9ca3af;
    --radius: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
  }

  header .logo {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  header .sep { color: var(--border); font-size: 18px; }
  header .title { font-size: 14px; color: var(--text-dim); font-weight: 300; }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  /* STEP INDICATORS */
  .steps {
    display: flex;
    gap: 0;
    margin-bottom: 36px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .step {
    flex: 1;
    padding: 12px 20px;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-muted);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
  }
  .step:last-child { border-right: none; }
  .step.active { color: var(--accent); background: rgba(0,229,160,0.06); }
  .step.done { color: var(--text-dim); }
  .step .num {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 1px solid currentColor;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    flex-shrink: 0;
  }
  .step.active .num { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .step.done .num { background: var(--surface2); }

  /* UPLOAD ZONE */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 60px 40px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--surface);
    position: relative;
  }
  .upload-zone:hover, .upload-zone.drag { border-color: var(--accent); background: rgba(0,229,160,0.04); }
  .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .upload-icon { font-size: 40px; margin-bottom: 16px; opacity: 0.5; }
  .upload-zone h2 { font-size: 16px; font-weight: 500; margin-bottom: 8px; }
  .upload-zone p { font-size: 13px; color: var(--text-muted); }
  .upload-zone .formats {
    margin-top: 16px;
    display: inline-flex;
    gap: 8px;
  }
  .badge {
    padding: 3px 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  /* FILE INFO */
  .file-info {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 28px;
  }
  .file-info .file-icon { font-size: 24px; }
  .file-info .file-name { font-size: 14px; font-weight: 500; }
  .file-info .file-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-family: 'IBM Plex Mono', monospace; }
  .file-info .change-btn {
    margin-left: auto;
    padding: 6px 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .file-info .change-btn:hover { border-color: var(--text-dim); color: var(--text); }

  /* SECTION HEADERS */
  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* FIELD BUTTONS */
  .fields-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 28px;
  }
  .fields-toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .fields-toolbar button {
    padding: 5px 12px;
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .fields-toolbar button:hover { border-color: var(--accent); color: var(--accent); }
  .fields-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .field-btn {
    padding: 8px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-size: 13px;
    font-family: 'IBM Plex Sans', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .field-btn:hover { border-color: var(--text-muted); color: var(--text); }
  .field-btn.selected {
    background: rgba(0,229,160,0.12);
    border-color: var(--accent);
    color: var(--accent);
  }
  .field-btn .check { font-size: 11px; opacity: 0; transition: opacity 0.15s; }
  .field-btn.selected .check { opacity: 1; }

  /* CONTROLS */
  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .run-btn {
    padding: 12px 28px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .run-btn:hover { background: #00ffb0; transform: translateY(-1px); }
  .run-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .selected-count {
    font-size: 13px;
    color: var(--text-muted);
    font-family: 'IBM Plex Mono', monospace;
  }
  .selected-count span { color: var(--accent); font-weight: 600; }

  /* OPTIONS */
  .options-row {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 28px;
  }
  .option-label {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .option-label input[type=checkbox] { accent-color: var(--accent); }

  /* RESULTS */
  #results { display: none; }

  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .stat-pills {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .stat-pill {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    border: 1px solid;
  }
  .stat-pill.total { border-color: var(--border); color: var(--text-muted); }
  .stat-pill.dupes { border-color: var(--danger); color: var(--danger); background: rgba(255,77,106,0.08); }
  .stat-pill.groups { border-color: var(--accent2); color: var(--accent2); background: rgba(0,119,255,0.08); }

  .export-btn {
    padding: 8px 18px;
    background: transparent;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    color: var(--accent);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .export-btn:hover { background: rgba(0,229,160,0.1); }

  /* TABLE */
  .table-wrap {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: auto;
    max-height: 520px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead { position: sticky; top: 0; z-index: 1; }
  thead th {
    background: var(--surface);
    padding: 11px 14px;
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  thead th.key-col { color: var(--accent); }
  tbody tr {
    border-bottom: 1px solid rgba(42,45,53,0.6);
    transition: background 0.1s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface); }
  tbody tr.group-start { border-top: 2px solid rgba(0,119,255,0.3); }
  tbody td {
    padding: 10px 14px;
    color: var(--text-dim);
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  tbody td.key-col { color: var(--text); font-weight: 500; }
  .row-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--border);
    padding-right: 8px;
  }
  .group-badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    background: rgba(0,119,255,0.15);
    color: var(--accent2);
    border: 1px solid rgba(0,119,255,0.3);
    white-space: nowrap;
  }

  /* EMPTY / ERROR STATES */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 36px; margin-bottom: 12px; opacity: 0.4; }
  .empty-state p { font-size: 14px; }

  .hidden { display: none !important; }

  /* LOADING */
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(0,229,160,0.3);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* SHEET SELECTOR */
  .sheet-selector {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .sheet-btn {
    padding: 6px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    cursor: pointer;
    transition: all 0.15s;
  }
  .sheet-btn.active { border-color: var(--accent2); color: var(--accent2); background: rgba(0,119,255,0.08); }

  .no-data-msg {
    padding: 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <span class="logo">DupeFinder</span>
  <span class="sep">/</span>
  <span class="title">Excel Duplicate Detector</span>
</header>

<div class="container">

  <div class="steps">
    <div class="step active" id="step1"><span class="num">1</span> Upload File</div>
    <div class="step" id="step2"><span class="num">2</span> Select Fields</div>
    <div class="step" id="step3"><span class="num">3</span> View Duplicates</div>
  </div>

  <!-- UPLOAD -->
  <div id="uploadSection">
    <div class="upload-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
      <div class="upload-icon">📊</div>
      <h2>Drop your spreadsheet here</h2>
      <p>or click to browse files</p>
      <div class="formats">
        <span class="badge">.xlsx</span>
        <span class="badge">.xls</span>
        <span class="badge">.csv</span>
      </div>
    </div>
  </div>

  <!-- CONFIGURE -->
  <div id="configSection" class="hidden">

    <div class="file-info" id="fileInfo">
      <span class="file-icon">📄</span>
      <div>
        <div class="file-name" id="fileName">—</div>
        <div class="file-meta" id="fileMeta">—</div>
      </div>
      <button class="change-btn" onclick="resetAll()">↩ Change file</button>
    </div>

    <!-- Sheet selector (shown only if multiple sheets) -->
    <div id="sheetSelectorWrap" class="hidden">
      <div class="section-label">Worksheet</div>
      <div class="sheet-selector" id="sheetSelector"></div>
    </div>

    <!-- Field buttons -->
    <div class="section-label">Select fields to check for duplicates</div>
    <div class="fields-wrap">
      <div class="fields-toolbar">
        <button onclick="selectAll()">Select All</button>
        <button onclick="deselectAll()">Deselect All</button>
      </div>
      <div class="fields-grid" id="fieldsGrid"></div>
    </div>

    <!-- Options -->
    <div class="options-row">
      <label class="option-label">
        <input type="checkbox" id="optCaseInsensitive" checked>
        Case-insensitive matching
      </label>
      <label class="option-label">
        <input type="checkbox" id="optTrimWhitespace" checked>
        Trim whitespace
      </label>
      <label class="option-label">
        <input type="checkbox" id="optShowAll">
        Show all duplicate rows (not just first occurrences)
      </label>
    </div>

    <div class="controls">
      <button class="run-btn" id="runBtn" onclick="findDuplicates()">
        <span id="runIcon">⚡</span> Find Duplicates
      </button>
      <span class="selected-count"><span id="selCount">0</span> fields selected</span>
    </div>

    <!-- RESULTS -->
    <div id="results">
      <div class="results-header">
        <div class="stat-pills">
          <span class="stat-pill total" id="statTotal">0 rows</span>
          <span class="stat-pill dupes" id="statDupes">0 duplicates</span>
          <span class="stat-pill groups" id="statGroups">0 groups</span>
        </div>
        <button class="export-btn" onclick="exportResults()">⬇ Export CSV</button>
      </div>

      <div class="table-wrap" id="tableWrap">
        <div class="no-data-msg">Run the finder to see results.</div>
      </div>
    </div>

  </div>
</div>

<script>
let workbook = null;
let currentSheet = null;
let rawData = [];
let headers = [];
let selectedFields = new Set();
let lastResults = [];
let currentFileName = '';

// ── Drag & drop ──────────────────────────────────────────────
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if (file) processFile(file);
});
document.getElementById('fileInput').addEventListener('change', e => {
  if (e.target.files[0]) processFile(e.target.files[0]);
});

// ── File processing ──────────────────────────────────────────
function processFile(file) {
  currentFileName = file.name;
  const reader = new FileReader();
  reader.onload = function(e) {
    const data = new Uint8Array(e.target.result);
    workbook = XLSX.read(data, { type: 'array' });

    const sheetNames = workbook.SheetNames;
    document.getElementById('uploadSection').classList.add('hidden');
    document.getElementById('configSection').classList.remove('hidden');
    document.getElementById('fileName').textContent = file.name;

    // Sheet selector
    const wrap = document.getElementById('sheetSelectorWrap');
    const sel = document.getElementById('sheetSelector');
    sel.innerHTML = '';
    if (sheetNames.length > 1) {
      wrap.classList.remove('hidden');
      sheetNames.forEach((name, i) => {
        const btn = document.createElement('button');
        btn.className = 'sheet-btn' + (i === 0 ? ' active' : '');
        btn.textContent = name;
        btn.onclick = () => {
          document.querySelectorAll('.sheet-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          loadSheet(name);
        };
        sel.appendChild(btn);
      });
    } else {
      wrap.classList.add('hidden');
    }

    loadSheet(sheetNames[0]);
    setStep(2);
  };
  reader.readAsArrayBuffer(file);
}

function loadSheet(sheetName) {
  currentSheet = sheetName;
  const ws = workbook.Sheets[sheetName];
  rawData = XLSX.utils.sheet_to_json(ws, { defval: '' });
  headers = rawData.length > 0 ? Object.keys(rawData[0]) : [];

  document.getElementById('fileMeta').textContent =
    `${headers.length} columns · ${rawData.length} rows · sheet: ${sheetName}`;

  renderFields();
  clearResults();
}

// ── Fields ───────────────────────────────────────────────────
function renderFields() {
  const grid = document.getElementById('fieldsGrid');
  grid.innerHTML = '';
  selectedFields.clear();
  updateSelCount();

  headers.forEach(h => {
    const btn = document.createElement('button');
    btn.className = 'field-btn';
    btn.dataset.field = h;
    btn.innerHTML = `<span class="check">✓</span> ${escHtml(h)}`;
    btn.onclick = () => toggleField(h, btn);
    grid.appendChild(btn);
  });
}

function toggleField(field, btn) {
  if (selectedFields.has(field)) {
    selectedFields.delete(field);
    btn.classList.remove('selected');
  } else {
    selectedFields.add(field);
    btn.classList.add('selected');
  }
  updateSelCount();
}

function selectAll() {
  headers.forEach(h => {
    selectedFields.add(h);
    const btn = document.querySelector(`.field-btn[data-field="${CSS.escape(h)}"]`);
    if (btn) btn.classList.add('selected');
  });
  updateSelCount();
}

function deselectAll() {
  selectedFields.clear();
  document.querySelectorAll('.field-btn').forEach(b => b.classList.remove('selected'));
  updateSelCount();
}

function updateSelCount() {
  document.getElementById('selCount').textContent = selectedFields.size;
}

// ── Find duplicates ──────────────────────────────────────────
function findDuplicates() {
  if (selectedFields.size === 0) {
    alert('Please select at least one field.');
    return;
  }

  const caseInsensitive = document.getElementById('optCaseInsensitive').checked;
  const trimWS = document.getElementById('optTrimWhitespace').checked;
  const showAll = document.getElementById('optShowAll').checked;

  const fields = Array.from(selectedFields);

  function makeKey(row) {
    return fields.map(f => {
      let v = String(row[f] ?? '');
      if (trimWS) v = v.trim();
      if (caseInsensitive) v = v.toLowerCase();
      return v;
    }).join('|||');
  }

  // Group rows by key
  const groups = new Map();
  rawData.forEach((row, idx) => {
    const key = makeKey(row);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({ row, idx: idx + 2 }); // +2: header + 1-based
  });

  // Only groups with >1 row = duplicates
  const dupGroups = [];
  groups.forEach((items, key) => {
    if (items.length > 1) dupGroups.push({ key, items });
  });

  // Sort groups by size desc
  dupGroups.sort((a, b) => b.items.length - a.items.length);

  // Flatten for display
  lastResults = [];
  dupGroups.forEach((g, gi) => {
    const rows = showAll ? g.items : g.items; // show all occurrences always
    rows.forEach((item, ii) => {
      lastResults.push({ ...item, groupIdx: gi + 1, groupSize: g.items.length, isFirst: ii === 0 });
    });
  });

  const totalDupes = dupGroups.reduce((s, g) => s + g.items.length, 0);

  document.getElementById('statTotal').textContent = `${rawData.length} rows`;
  document.getElementById('statDupes').textContent = `${totalDupes} duplicate rows`;
  document.getElementById('statGroups').textContent = `${dupGroups.length} groups`;

  renderTable(fields);
  document.getElementById('results').style.display = 'block';
  setStep(3);
}

function renderTable(keyFields) {
  const wrap = document.getElementById('tableWrap');

  if (lastResults.length === 0) {
    wrap.innerHTML = `<div class="empty-state"><div class="icon">✅</div><p>No duplicates found for the selected fields.</p></div>`;
    return;
  }

  const keySet = new Set(keyFields);
  const allCols = headers;

  let html = '<table><thead><tr>';
  html += '<th>#</th><th>Row</th><th>Group</th>';
  allCols.forEach(h => {
    html += `<th class="${keySet.has(h) ? 'key-col' : ''}">${escHtml(h)}</th>`;
  });
  html += '</tr></thead><tbody>';

  lastResults.forEach((item, i) => {
    const rowClass = item.isFirst ? 'group-start' : '';
    html += `<tr class="${rowClass}">`;
    html += `<td class="row-num">${i + 1}</td>`;
    html += `<td class="row-num">${item.idx}</td>`;
    html += `<td><span class="group-badge">G${item.groupIdx} · ${item.groupSize}×</span></td>`;
    allCols.forEach(h => {
      const v = item.row[h] ?? '';
      html += `<td class="${keySet.has(h) ? 'key-col' : ''}" title="${escHtml(String(v))}">${escHtml(String(v))}</td>`;
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  wrap.innerHTML = html;
}

// ── Export ───────────────────────────────────────────────────
function exportResults() {
  if (lastResults.length === 0) return;

  const rows = [['#', 'OriginalRow', 'DuplicateGroup', 'GroupSize', ...headers]];
  lastResults.forEach((item, i) => {
    rows.push([
      i + 1, item.idx, item.groupIdx, item.groupSize,
      ...headers.map(h => item.row[h] ?? '')
    ]);
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Duplicates');
  XLSX.writeFile(wb, 'duplicates_export.xlsx');
}

// ── Helpers ──────────────────────────────────────────────────
function clearResults() {
  lastResults = [];
  document.getElementById('results').style.display = 'none';
  document.getElementById('tableWrap').innerHTML = '<div class="no-data-msg">Run the finder to see results.</div>';
}

function resetAll() {
  workbook = null; rawData = []; headers = []; selectedFields.clear(); lastResults = [];
  document.getElementById('uploadSection').classList.remove('hidden');
  document.getElementById('configSection').classList.add('hidden');
  document.getElementById('fileInput').value = '';
  clearResults();
  setStep(1);
}

function setStep(n) {
  [1,2,3].forEach(i => {
    const el = document.getElementById('step' + i);
    el.classList.remove('active', 'done');
    if (i < n) el.classList.add('done');
    if (i === n) el.classList.add('active');
  });
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

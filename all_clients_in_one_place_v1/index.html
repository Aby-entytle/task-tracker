<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Client Hub</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f7f7f5;
    --bg-tertiary: #f0efeb;
    --text-primary: #1a1a18;
    --text-secondary: #6b6b67;
    --text-tertiary: #a0a09c;
    --border-tertiary: rgba(0,0,0,0.12);
    --border-secondary: rgba(0,0,0,0.2);
    --border-primary: rgba(0,0,0,0.3);
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #1e1e1c;
      --bg-secondary: #252523;
      --bg-tertiary: #2c2c2a;
      --text-primary: #f0efe9;
      --text-secondary: #a0a09a;
      --text-tertiary: #6b6b65;
      --border-tertiary: rgba(255,255,255,0.1);
      --border-secondary: rgba(255,255,255,0.18);
      --border-primary: rgba(255,255,255,0.28);
    }
  }

  body {
    font-family: var(--font-sans);
    background: var(--bg-tertiary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .app {
    display: flex;
    width: 900px;
    max-width: 100%;
    height: 700px;
    border: 0.5px solid var(--border-tertiary);
    border-radius: var(--radius-xl);
    overflow: hidden;
    background: var(--bg-primary);
    box-shadow: 0 4px 32px rgba(0,0,0,0.08);
  }

  /* Sidebar */
  .sidebar {
    width: 230px;
    min-width: 230px;
    border-right: 0.5px solid var(--border-tertiary);
    display: flex;
    flex-direction: column;
    background: var(--bg-secondary);
  }

  .sidebar-header {
    padding: 16px 14px 12px;
    border-bottom: 0.5px solid var(--border-tertiary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sidebar-header i { font-size: 18px; color: #534AB7; }

  .sidebar-header h1 {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-primary);
  }

  .client-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .client-list::-webkit-scrollbar { width: 4px; }
  .client-list::-webkit-scrollbar-track { background: transparent; }
  .client-list::-webkit-scrollbar-thumb { background: var(--border-secondary); border-radius: 4px; }

  .client-item {
    display: flex;
    align-items: center;
    padding: 8px 10px;
    border-radius: var(--radius-md);
    cursor: pointer;
    gap: 8px;
    margin-bottom: 2px;
    border: 0.5px solid transparent;
    transition: background 0.1s;
  }

  .client-item:hover { background: var(--bg-primary); }
  .client-item.active {
    background: var(--bg-primary);
    border-color: var(--border-secondary);
  }

  .client-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 500;
    flex-shrink: 0;
  }

  .client-name {
    font-size: 14px;
    color: var(--text-primary);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .del-btn {
    opacity: 0;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-secondary);
    padding: 3px;
    border-radius: 4px;
    font-size: 14px;
    line-height: 1;
    transition: opacity 0.15s;
  }

  .client-item:hover .del-btn { opacity: 1; }
  .del-btn:hover { color: #A32D2D; background: var(--bg-secondary); }

  .add-client-area {
    padding: 10px 12px 14px;
    border-top: 0.5px solid var(--border-tertiary);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .add-client-area input {
    width: 100%;
    font-size: 13px;
    padding: 7px 10px;
    border: 0.5px solid var(--border-secondary);
    border-radius: var(--radius-md);
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-sans);
  }

  .add-client-area input::placeholder { color: var(--text-tertiary); }
  .add-client-area input:focus { outline: none; border-color: #534AB7; box-shadow: 0 0 0 2px rgba(83,74,183,0.15); }

  .btn-add {
    width: 100%;
    padding: 7px;
    font-size: 13px;
    border: 0.5px solid var(--border-secondary);
    border-radius: var(--radius-md);
    cursor: pointer;
    background: var(--bg-primary);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: var(--font-sans);
    transition: background 0.1s;
  }

  .btn-add:hover { background: var(--bg-tertiary); }

  /* Main */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg-primary);
  }

  .main-header {
    padding: 14px 20px 13px;
    border-bottom: 0.5px solid var(--border-tertiary);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .client-title {
    font-size: 17px;
    font-weight: 500;
    color: var(--text-primary);
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 2px;
    padding: 10px 20px 0;
    border-bottom: 0.5px solid var(--border-tertiary);
    overflow-x: auto;
  }

  .tabs::-webkit-scrollbar { height: 0; }

  .tab {
    padding: 7px 13px;
    font-size: 13px;
    cursor: pointer;
    border-radius: var(--radius-md) var(--radius-md) 0 0;
    color: var(--text-secondary);
    border: 0.5px solid transparent;
    border-bottom: none;
    position: relative;
    top: 1px;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.1s, color 0.1s;
    font-family: var(--font-sans);
    background: none;
  }

  .tab:hover { color: var(--text-primary); background: var(--bg-secondary); }
  .tab.active {
    color: var(--text-primary);
    background: var(--bg-primary);
    border-color: var(--border-tertiary);
    font-weight: 500;
  }

  /* Tab content */
  .tab-content {
    flex: 1;
    overflow-y: auto;
    padding: 18px 20px;
  }

  .tab-content::-webkit-scrollbar { width: 4px; }
  .tab-content::-webkit-scrollbar-track { background: transparent; }
  .tab-content::-webkit-scrollbar-thumb { background: var(--border-secondary); border-radius: 4px; }

  .section-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-bottom: 10px;
  }

  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    align-items: center;
  }

  .add-row input {
    flex: 1;
    font-size: 13px;
    padding: 7px 10px;
    border: 0.5px solid var(--border-secondary);
    border-radius: var(--radius-md);
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-sans);
  }

  .add-row input::placeholder { color: var(--text-tertiary); }
  .add-row input:focus { outline: none; border-color: #534AB7; box-shadow: 0 0 0 2px rgba(83,74,183,0.15); }

  .btn-primary {
    padding: 7px 14px;
    font-size: 13px;
    border: 0.5px solid #534AB7;
    border-radius: var(--radius-md);
    cursor: pointer;
    background: #EEEDFE;
    color: #3C3489;
    white-space: nowrap;
    font-weight: 500;
    font-family: var(--font-sans);
    display: flex;
    align-items: center;
    gap: 5px;
    transition: background 0.1s;
  }

  .btn-primary:hover { background: #CECBF6; }

  /* Link cards */
  .link-card {
    background: var(--bg-secondary);
    border: 0.5px solid var(--border-tertiary);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: border-color 0.1s;
  }

  .link-card:hover { border-color: var(--border-secondary); }

  .link-info { flex: 1; min-width: 0; }

  .link-title {
    font-size: 14px;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
  }

  .link-url {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  .link-actions { display: flex; gap: 4px; flex-shrink: 0; }

  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-secondary);
    padding: 5px;
    border-radius: var(--radius-md);
    font-size: 16px;
    line-height: 1;
    transition: color 0.1s, background 0.1s;
  }

  .icon-btn:hover { color: var(--text-primary); background: var(--bg-primary); }
  .icon-btn.danger:hover { color: #A32D2D; background: #FCEBEB; }

  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    font-weight: 500;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .badge-meeting { background: #E6F1FB; color: #0C447C; }
  .badge-drive   { background: #EAF3DE; color: #27500A; }
  .badge-rec     { background: #FAECE7; color: #712B13; }
  .badge-doc     { background: #FAEEDA; color: #633806; }
  .badge-daily   { background: #EEEDFE; color: #3C3489; }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 50px 0;
    color: var(--text-secondary);
    font-size: 14px;
  }

  .empty i { font-size: 36px; display: block; margin-bottom: 10px; opacity: .35; }

  /* Welcome screen */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-secondary);
    gap: 12px;
  }

  .welcome i { font-size: 48px; opacity: .25; }
  .welcome p { font-size: 15px; }
  .welcome small { font-size: 13px; color: var(--text-tertiary); }

  /* Empty client list */
  .no-clients {
    padding: 16px 12px;
    font-size: 13px;
    color: var(--text-tertiary);
    text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="app" role="main">
  <aside class="sidebar" aria-label="Client list">
    <div class="sidebar-header">
      <i class="ti ti-building-community" aria-hidden="true"></i>
      <h1>Client Hub</h1>
    </div>
    <div class="client-list" id="clientList" role="list"></div>
    <div class="add-client-area">
      <input type="text" id="newClientInput" placeholder="New client name…" maxlength="60" aria-label="New client name" />
      <button class="btn-add" onclick="addClient()" aria-label="Add client">
        <i class="ti ti-plus" aria-hidden="true"></i> Add client
      </button>
    </div>
  </aside>

  <div class="main" id="mainPanel" role="region" aria-label="Client details"></div>
</div>

<script>
  const COLORS = [
    ['#EEEDFE','#3C3489'],
    ['#E1F5EE','#085041'],
    ['#FAECE7','#712B13'],
    ['#E6F1FB','#0C447C'],
    ['#EAF3DE','#27500A'],
    ['#FAEEDA','#633806'],
    ['#FBEAF0','#72243E'],
  ];

  const TABS = [
    { id: 'meetings',   label: 'Meeting links',   icon: 'ti-video',            badge: 'badge-meeting', ph: { title: 'e.g. Weekly sync',          url: 'https://meet.google.com/...' } },
    { id: 'drive',      label: 'Drive',            icon: 'ti-brand-google-drive',badge: 'badge-drive',   ph: { title: 'e.g. Project assets',        url: 'https://drive.google.com/...' } },
    { id: 'recordings', label: 'Recordings / KT',  icon: 'ti-player-play',      badge: 'badge-rec',     ph: { title: 'e.g. Onboarding KT',         url: 'https://drive.google.com/...' } },
    { id: 'ktdocs',     label: 'KT docs',          icon: 'ti-file-description', badge: 'badge-doc',     ph: { title: 'e.g. Architecture overview',  url: 'https://docs.google.com/...' } },
    { id: 'daily',      label: 'Daily docs',       icon: 'ti-calendar-week',    badge: 'badge-daily',   ph: { title: 'e.g. Standup notes',         url: 'https://docs.google.com/...' } },
  ];

  let data = {};
  let activeClient = null;
  let activeTab = 'meetings';

  function save() {
    try { localStorage.setItem('clienthub_v2', JSON.stringify({ data, activeClient, activeTab })); } catch(e) {}
  }

  function load() {
    try {
      const d = JSON.parse(localStorage.getItem('clienthub_v2') || '{}');
      if (d.data) data = d.data;
      if (d.activeClient && data[d.activeClient]) activeClient = d.activeClient;
      if (d.activeTab) activeTab = d.activeTab;
    } catch(e) {}
  }

  function initClient(name) {
    if (!data[name]) {
      const idx = Object.keys(data).length % COLORS.length;
      data[name] = { color: COLORS[idx], meetings: [], drive: [], recordings: [], ktdocs: [], daily: [] };
    }
  }

  function getInitials(n) {
    return n.trim().split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderSidebar() {
    const list = document.getElementById('clientList');
    const names = Object.keys(data);
    if (!names.length) {
      list.innerHTML = '<div class="no-clients">Add a client below<br>to get started</div>';
      return;
    }
    list.innerHTML = names.map(n => {
      const [bg, fg] = data[n].color;
      return `<div class="client-item${n === activeClient ? ' active' : ''}" onclick="selectClient('${esc(n)}')" role="listitem" tabindex="0" onkeydown="if(event.key==='Enter')selectClient('${esc(n)}')">
        <div class="client-avatar" style="background:${bg};color:${fg}" aria-hidden="true">${getInitials(n)}</div>
        <span class="client-name">${esc(n)}</span>
        <button class="del-btn" onclick="event.stopPropagation();removeClient('${esc(n)}')" title="Remove ${esc(n)}" aria-label="Remove ${esc(n)}"><i class="ti ti-x"></i></button>
      </div>`;
    }).join('');
  }

  function selectClient(name) {
    activeClient = name;
    activeTab = 'meetings';
    renderSidebar();
    renderMain();
    save();
  }

  function addClient() {
    const inp = document.getElementById('newClientInput');
    const name = inp.value.trim();
    if (!name) { inp.focus(); return; }
    if (data[name]) { alert(`"${name}" already exists.`); return; }
    initClient(name);
    activeClient = name;
    activeTab = 'meetings';
    inp.value = '';
    renderSidebar();
    renderMain();
    save();
  }

  function removeClient(name) {
    if (!confirm(`Remove "${name}" and all their stored links?`)) return;
    delete data[name];
    if (activeClient === name) activeClient = null;
    renderSidebar();
    renderMain();
    save();
  }

  function renderMain() {
    const panel = document.getElementById('mainPanel');
    if (!activeClient || !data[activeClient]) {
      panel.innerHTML = `<div class="welcome">
        <i class="ti ti-building-community" aria-hidden="true"></i>
        <p>Select a client to view their links</p>
        <small>Or add a new client from the sidebar</small>
      </div>`;
      return;
    }
    const [bg, fg] = data[activeClient].color;
    const tabsHtml = TABS.map(t =>
      `<button class="tab${activeTab === t.id ? ' active' : ''}" onclick="switchTab('${t.id}')" aria-selected="${activeTab === t.id}">
        <i class="ti ${t.icon}" aria-hidden="true"></i>${t.label}
      </button>`
    ).join('');

    panel.innerHTML = `
      <div class="main-header">
        <div class="client-avatar" style="width:36px;height:36px;font-size:13px;background:${bg};color:${fg};border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:500;flex-shrink:0" aria-hidden="true">${getInitials(activeClient)}</div>
        <span class="client-title">${esc(activeClient)}</span>
      </div>
      <div class="tabs" role="tablist">${tabsHtml}</div>
      <div class="tab-content" id="tabContent" role="tabpanel"></div>`;

    renderTab();
  }

  function switchTab(id) {
    activeTab = id;
    document.querySelectorAll('.tab').forEach(t => {
      const isActive = TABS.find(x => x.id === id).label === t.textContent.trim().replace(/^[\s\S]*?([\w\s\/]+)$/, '$1').trim();
      t.classList.toggle('active', t.getAttribute('onclick') === `switchTab('${id}')`);
    });
    renderTab();
    save();
  }

  function renderTab() {
    const tc = document.getElementById('tabContent');
    if (!tc) return;
    const tab = TABS.find(t => t.id === activeTab);
    const items = data[activeClient][activeTab] || [];

    tc.innerHTML = `
      <div class="section-label">${esc(tab.label)}</div>
      <div class="add-row">
        <input type="text" id="newTitle" placeholder="${esc(tab.ph.title)}" maxlength="80" aria-label="Link title" />
        <input type="text" id="newUrl"   placeholder="${esc(tab.ph.url)}"   maxlength="500" aria-label="Link URL" />
        <button class="btn-primary" onclick="addItem()"><i class="ti ti-plus" aria-hidden="true"></i> Add</button>
      </div>
      <div id="itemList"></div>`;

    renderItems();
  }

  function renderItems() {
    const list = document.getElementById('itemList');
    if (!list) return;
    const tab = TABS.find(t => t.id === activeTab);
    const items = data[activeClient][activeTab] || [];

    if (!items.length) {
      list.innerHTML = `<div class="empty"><i class="ti ${tab.icon}" aria-hidden="true"></i>No ${tab.label.toLowerCase()} added yet</div>`;
      return;
    }

    list.innerHTML = items.map((item, i) => `
      <div class="link-card">
        <span class="badge ${tab.badge}" aria-hidden="true"><i class="ti ${tab.icon}"></i></span>
        <div class="link-info">
          <div class="link-title">${esc(item.title)}</div>
          <div class="link-url">${esc(item.url)}</div>
        </div>
        <div class="link-actions">
          <button class="icon-btn" onclick="openUrl('${esc(item.url)}')" title="Open link" aria-label="Open ${esc(item.title)}"><i class="ti ti-external-link"></i></button>
          <button class="icon-btn" onclick="copyUrl('${esc(item.url)}')" title="Copy URL" aria-label="Copy URL for ${esc(item.title)}"><i class="ti ti-copy"></i></button>
          <button class="icon-btn danger" onclick="removeItem(${i})" title="Remove" aria-label="Remove ${esc(item.title)}"><i class="ti ti-trash"></i></button>
        </div>
      </div>`).join('');
  }

  function addItem() {
    const title = document.getElementById('newTitle').value.trim();
    const url   = document.getElementById('newUrl').value.trim();
    if (!title || !url) {
      if (!title) document.getElementById('newTitle').focus();
      else document.getElementById('newUrl').focus();
      return;
    }
    if (!data[activeClient][activeTab]) data[activeClient][activeTab] = [];
    data[activeClient][activeTab].push({ title, url });
    document.getElementById('newTitle').value = '';
    document.getElementById('newUrl').value = '';
    document.getElementById('newTitle').focus();
    renderItems();
    save();
  }

  function removeItem(i) {
    data[activeClient][activeTab].splice(i, 1);
    renderItems();
    save();
  }

  function openUrl(url) {
    window.open(url, '_blank', 'noopener,noreferrer');
  }

  function copyUrl(url) {
    navigator.clipboard.writeText(url).then(() => {
      /* brief visual feedback via title */
    }).catch(() => {
      prompt('Copy this URL:', url);
    });
  }

  /* Keyboard shortcuts */
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const f = document.activeElement;
      if (f && f.id === 'newClientInput') addClient();
      else if (f && (f.id === 'newTitle' || f.id === 'newUrl')) addItem();
    }
  });

  load();
  renderSidebar();
  renderMain();
</script>
</body>
</html>
